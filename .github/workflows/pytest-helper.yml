name: pytest-helper

on:
  workflow_call:
    inputs:
      test_name:
        description: "The name of the test"
        required: true
        type: string
      test_path:
        description: "The path to the test directory"
        required: true
        type: string
      test_workers:
        description: "The number of workers to run the tests"
        required: true
        type: number
      python_version:
        description: "The version of Python to use"
        required: false
        type: string
        default: "3.10"
      enable_coverage:
        description: "Whether to enable coverage measurement and reporting"
        required: false
        type: boolean
        default: false
      enable_comment:
        description: "Whether to enable comment on the pytest result"
        required: false
        type: boolean
        default: true

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Sync dev dependencies
        run: |
          uv sync --python ${{ inputs.python_version }}
          uv pip install -e .

      - name: Run unit tests with pytest
        run: |
          if [ "${{ inputs.enable_coverage }}" == "true" ]; then
            uv run --no-sync pytest ${{ inputs.test_path }} \
              -n ${{ inputs.test_workers }} \
              --verbose \
              --tb=short \
              --color=yes \
              --showlocals \
              --junitxml=pytest-report.xml \
              --cov devenv \
              --cov-report xml:coverage.xml \
              | tee pytest-coverage.txt
          else
            uv run --no-sync pytest ${{ inputs.test_path }} \
              -n ${{ inputs.test_workers }} \
              --verbose \
              --tb=short \
              --color=yes \
              --showlocals \
              --junitxml=pytest-report.xml \
              | tee pytest-coverage.txt
          fi

      - name: Comment pytest result (pass rate / coverage)
        uses: MishaKav/pytest-coverage-comment@v1
        if: always() && inputs.enable_comment == true && inputs.enable_coverage == true
        with:
          pytest-coverage-path: pytest-coverage.txt
          pytest-xml-coverage-path: coverage.xml
          title: ${{ inputs.test_name }}
          create-new-comment: false
          report-only-changed-files: true
          junitxml-path: pytest-report.xml
          junitxml-title: ${{ inputs.test_name }} Summary
        continue-on-error: true

      - name: Comment pytest result (pass rate only)
        uses: MishaKav/pytest-coverage-comment@v1
        if: always() && inputs.enable_comment == true && inputs.enable_coverage == false
        with:
          title: ${{ inputs.test_name }}
          create-new-comment: false
          report-only-changed-files: true
          junitxml-path: pytest-report.xml
          junitxml-title: ${{ inputs.test_name }} Summary
        continue-on-error: true

      - name: Publish pytest report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: ${{ inputs.test_name }}_report
          path: pytest-report.xml
          reporter: java-junit
          fail-on-error: true
