# ========================================================================================
# Modern Tmux Configuration
# ========================================================================================

# ----------------------------------------
# Terminal & Display
# ----------------------------------------
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-features ",*:RGB,*:usstyle,*:clipboard"
set -g default-shell /bin/zsh

# Fix slow escape in vim/nvim
set -sg escape-time 10
set -g focus-events on

# ----------------------------------------
# Clipboard Integration
# ----------------------------------------
set -g set-clipboard on

# ----------------------------------------
# Mouse Support
# ----------------------------------------
set -g mouse on

# Enable mouse scrolling in copy mode
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# ----------------------------------------
# History & Performance
# ----------------------------------------
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5

# ----------------------------------------
# Window & Pane Management
# ----------------------------------------
set -g base-index 1           # Windows 1부터 시작
setw -g pane-base-index 1     # Panes 1부터 시작
set -g renumber-windows on    # Window 삭제시 자동 재번호
setw -g automatic-rename on   # 자동 이름 변경
setw -g aggressive-resize on  # 작은 클라이언트에 맞춰 크기 조정

# ----------------------------------------
# Key Bindings
# ----------------------------------------
# Prefix key (기본값 Ctrl-b 유지, 원하면 Ctrl-a로 변경)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes (더 직관적)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (Prefix 없이 Option+화살표)
# 맥 사용자: iTerm2에서 Option key를 Esc+로 설정 필요
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 대안: Prefix + hjkl (vim style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (Prefix + 화살표)
bind Left resize-pane -L 5
bind Right resize-pane -R 5
bind Up resize-pane -U 5
bind Down resize-pane -D 5

# Window navigation
# 맥: Shift + 화살표 (iTerm2에서 잘 작동)
bind -n S-Left previous-window
bind -n S-Right next-window
# 대안: Prefix + np
bind n next-window
bind p previous-window

# ----------------------------------------
# Copy Mode (Vi style)
# ----------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# ----------------------------------------
# Status Bar Design
# ----------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left

# Colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#89b4fa,fg=#1e1e2e"
set -g message-command-style "bg=#89b4fa,fg=#1e1e2e"

# Left status
set -g status-left-length 100
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right status
set -g status-right-length 100
set -g status-right "#[fg=#f38ba8]#[bg=#f38ba8,fg=#1e1e2e] %Y-%m-%d #[bg=#89b4fa,fg=#1e1e2e] %H:%M "

# Window status
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "
setw -g window-status-separator ""

# ----------------------------------------
# Pane Borders
# ----------------------------------------
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"

# ----------------------------------------
# Plugin Manager (TPM)
# ----------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Plugin configurations
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ----------------------------------------
# Additional Quality of Life
# ----------------------------------------
# Better mouse behavior
unbind -T copy-mode-vi MouseDragEnd1Pane
set -g @yank_selection_mouse 'clipboard'

# Mouse drag automatically copies to clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity off

# Disable bell
set -g bell-action none
set -g visual-bell off

# ========================================================================================
# Initialize TPM (keep this at the very bottom)
# ========================================================================================
run '~/.tmux/plugins/tpm/tpm'
